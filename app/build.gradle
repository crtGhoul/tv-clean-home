plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.tvcleaner'
    compileSdk 34

    defaultConfig {
        applicationId "com.custom.tvcleaner"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with debug key by default so APK is immediately installable via ADB
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android framework - zero external dependencies required.
    // Built directly against Android SDK framework classes (android.app, android.widget, android.net, etc.)
}
